name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install interoperability test oracle
        run: python -m pip install amazon.ion==0.13.0

      - name: Show toolchain versions
        run: |
          moon version --all | tee /tmp/moon-versions.txt
          grep -E 'moonc v(0\.10\.(1[4-9]|[2-9][0-9])|0\.(1[1-9]|[2-9][0-9])\.|[1-9][0-9]*\.)' /tmp/moon-versions.txt

      - name: Format
        shell: bash
        run: |
          moon fmt
          git diff --exit-code

      - name: Check backends
        run: |
          moon check --target wasm-gc --deny-warn
          moon check --target wasm --deny-warn
          moon check --target js --deny-warn
          moon check --target native --deny-warn

      - name: Build backends
        run: |
          moon build --target wasm-gc
          moon build --target wasm
          moon build --target js
          moon build --target native

      - name: Test portable backends
        run: |
          moon test --target wasm-gc
          moon test --target js
          moon test --target native

      - name: Verify Amazon Ion interoperability
        run: |
          python tests/verify_interop.py --target wasm-gc
          python tests/verify_interop.py --target js
          python tests/verify_interop.py --target native

      - name: Run examples
        run: |
          moon run examples/catalog_record
          moon run examples/binary_roundtrip
          moon run examples/sexp_filter
          moon run cmd/main
